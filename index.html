<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PerpetualDoc</title>
<link rel="icon" href="favicon.ico" type="image/x-icon" />
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
<style>
  :root{
    --bg:#0a0d12;
    --bg-soft:#0d1117;
    --panel:#12161f;
    --panel-2:#171d29;
    --border:#242c3a;
    --border-soft:#1b212c;
    --text:#e9edf3;
    --text-dim:#8f9bb0;
    --text-faint:#5c6579;
    --accent:#e8a33d;
    --accent-strong:#ffc266;
    --accent-soft:rgba(232,163,61,0.13);
    --ok:#4fd1ae;
    --danger:#f1707c;
    --radius:10px;
    --radius-lg:16px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 20px 50px rgba(0,0,0,0.45);
  }
  body.pd-light{
    --bg:#f4f5f7;
    --bg-soft:#eef0f3;
    --panel:#ffffff;
    --panel-2:#f6f7f9;
    --border:#e1e4ea;
    --border-soft:#eaecf1;
    --text:#1b2028;
    --text-dim:#5b6472;
    --text-faint:#8b93a3;
    --accent:#b6791f;
    --accent-strong:#8f5c12;
    --accent-soft:rgba(182,121,31,0.12);
    --ok:#0f9d76;
    --danger:#c23345;
    --shadow:0 20px 50px rgba(20,20,30,0.12);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    transition:background .25s ease,color .25s ease;
  }
  ::selection{ background:var(--accent-soft); color:var(--accent-strong); }
  button{ font-family:inherit; }
  a{ color:inherit; }

  /* ---------- shell ---------- */
  #app{ height:100vh; display:flex; flex-direction:column; }

  .pd-topline{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px;
    border-bottom:1px solid var(--border-soft);
    background:linear-gradient(var(--bg-soft),var(--bg-soft));
    flex-shrink:0;
  }
  .pd-brand{ display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none; }
  .pd-brand-mark{
    width:26px;height:26px;border-radius:7px;
    flex-shrink:0; object-fit:cover; display:block;
    background:transparent;
  }
  .pd-brand-name{ font-weight:600; font-size:14.5px; letter-spacing:.2px; }
  .pd-brand-sub{ color:var(--text-faint); font-size:12px; margin-left:8px; font-family:var(--mono); }

  .pd-topline-right{ display:flex; align-items:center; gap:10px; }
  .pd-pill{
    display:flex; align-items:center; gap:7px;
    padding:6px 11px; border-radius:999px;
    border:1px solid var(--border); background:var(--panel);
    font-size:12.5px; color:var(--text-dim);
  }
  .pd-pill .dot{ width:7px;height:7px;border-radius:50%; background:var(--ok); flex-shrink:0; }
  .pd-pill.warn .dot{ background:var(--danger); }
  .pd-btn{
    border:1px solid var(--border); background:var(--panel); color:var(--text);
    padding:7px 13px; border-radius:8px; font-size:13px; cursor:pointer;
    transition:border-color .15s, background .15s, transform .05s;
    text-decoration:none; box-sizing:border-box;
  }
  .pd-btn:hover{ border-color:var(--accent); background:var(--panel-2); }
  .pd-btn:active{ transform:translateY(1px); }
  .pd-btn.ghost{ background:transparent; }
  .pd-btn.icon{ width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center; }
  .pd-btn svg{ width:15px;height:15px; }

  /* ---------- home / spotlight ---------- */
  #view-home{
    flex:1; display:flex; flex-direction:column; align-items:center;
    padding:min(14vh,140px) 20px 40px;
  }
  .pd-hero{ text-align:center; margin-bottom:34px; max-width:560px; }
  .pd-hero h1{
    font-size:26px; font-weight:600; margin:0 0 8px; letter-spacing:-0.2px;
  }
  .pd-hero p{ margin:0; color:var(--text-dim); font-size:14.5px; line-height:1.5; }

  .pd-search-shell{ width:100%; max-width:640px; position:relative; }
  .pd-search-box{
    display:flex; align-items:center; gap:12px;
    background:var(--panel); border:1px solid var(--border);
    border-radius:var(--radius-lg); padding:16px 20px;
    box-shadow:var(--shadow);
    transition:border-color .15s, box-shadow .15s;
  }
  .pd-search-box:focus-within{ border-color:var(--accent); }
  .pd-search-box svg{ width:19px; height:19px; color:var(--text-faint); flex-shrink:0; }
  .pd-search-box input{
    flex:1; border:0; outline:0; background:transparent;
    color:var(--text); font-size:17px; font-family:var(--sans);
  }
  .pd-search-box input::placeholder{ color:var(--text-faint); }
  .pd-kbd{
    font-family:var(--mono); font-size:11px; color:var(--text-faint);
    border:1px solid var(--border); border-bottom-width:2px;
    border-radius:5px; padding:2px 6px; flex-shrink:0;
  }

  .pd-results{
    margin-top:10px; width:100%;
    background:var(--panel); border:1px solid var(--border);
    border-radius:var(--radius-lg); overflow:hidden;
    box-shadow:var(--shadow);
    max-height:min(56vh,520px); overflow-y:auto;
  }
  .pd-result{
    display:block; width:100%; text-align:left; border:0; background:transparent;
    padding:13px 20px; cursor:pointer; color:var(--text);
    border-bottom:1px solid var(--border-soft);
    border-left:3px solid transparent;
  }
  .pd-result:last-child{ border-bottom:0; }
  .pd-result:hover, .pd-result.active{
    background:var(--accent-soft); border-left-color:var(--accent);
  }
  .pd-result-title{ font-size:14.5px; font-weight:600; margin-bottom:3px; }
  .pd-result-path{
    font-family:var(--mono); font-size:11.5px; color:var(--text-faint); margin-bottom:5px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .pd-result-snippet{ font-size:13px; color:var(--text-dim); line-height:1.45;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .pd-result mark{ background:none; color:var(--accent-strong); font-weight:700; }

  .pd-empty-state{ padding:26px 20px; color:var(--text-faint); font-size:13.5px; text-align:center; }

  .pd-footnote{
    margin-top:22px; font-size:12px; color:var(--text-faint);
    display:flex; align-items:center; gap:7px;
  }
  .pd-footnote svg{ width:13px;height:13px; }
  .pd-footnote-link{ margin-top:8px; }
  .pd-footnote-link a{ color:var(--text-faint); text-decoration:underline; text-underline-offset:2px; }
  .pd-footnote-link a:hover{ color:var(--text-dim); }

  /* ---------- connect screen ---------- */
  .pd-connect{
    max-width:460px; width:100%; margin:0 auto; text-align:center;
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:36px 30px; box-shadow:var(--shadow);
  }
  .pd-connect h2{ font-size:18px; margin:0 0 8px; }
  .pd-connect p{ color:var(--text-dim); font-size:13.5px; line-height:1.55; margin:0 0 22px; }
  .pd-connect .pd-btn.primary{
    background:var(--accent); border-color:var(--accent); color:#1a1206; font-weight:600;
    padding:10px 22px; font-size:14px; width:100%;
  }
  .pd-connect .pd-btn.primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
  .pd-connect .pd-alt{ margin-top:12px; font-size:12.5px; color:var(--text-faint); }
  .pd-connect .pd-alt button{ background:none;border:0;color:var(--text-dim);text-decoration:underline;cursor:pointer;font-size:12.5px; }
  .pd-connect .pd-progress{ margin-top:18px; font-size:13px; color:var(--text-dim); font-family:var(--mono); }
  .pd-connect .pd-error{ margin-top:16px; padding:10px 12px; border-radius:8px; background:rgba(241,112,124,0.12); color:var(--danger); font-size:13px; text-align:left; }

  .pd-spinner{
    width:22px;height:22px;border-radius:50%;
    border:2.5px solid var(--border); border-top-color:var(--accent);
    animation:pdspin .7s linear infinite; margin:0 auto 14px;
  }
  @keyframes pdspin{ to{ transform:rotate(360deg); } }

  /* ---------- doc view ---------- */
  #view-doc{ flex:1; display:none; flex-direction:column; min-height:0; }
  #view-doc.active{ display:flex; }
  #view-home.hidden{ display:none; }

  .pd-docbar{
    display:flex; align-items:center; gap:10px;
    padding:10px 16px; border-bottom:1px solid var(--border-soft);
    background:var(--bg-soft); flex-shrink:0; flex-wrap:wrap;
  }
  .pd-crumb{
    font-family:var(--mono); font-size:12.5px; color:var(--text-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:120px;
  }
  .pd-crumb b{ color:var(--text); font-weight:600; }
  .pd-docsearch{
    display:flex; align-items:center; gap:5px;
    background:var(--panel); border:1px solid var(--border); border-radius:8px;
    padding:4px 6px 4px 10px;
  }
  .pd-docsearch svg{ width:13px;height:13px;color:var(--text-faint); }
  .pd-docsearch input{
    border:0; outline:0; background:transparent; color:var(--text);
    font-size:12.5px; width:150px; font-family:var(--sans);
  }
  .pd-docsearch .cnt{ font-size:11px; color:var(--text-faint); font-family:var(--mono); white-space:nowrap; padding:0 3px; }
  .pd-docsearch .pd-navbtn{
    border:0; background:transparent; color:var(--text-dim); cursor:pointer;
    width:22px; height:22px; display:flex; align-items:center; justify-content:center;
    border-radius:5px; flex-shrink:0;
  }
  .pd-docsearch .pd-navbtn:hover{ background:var(--panel-2); color:var(--text); }
  .pd-docsearch .pd-navbtn svg{ width:12px;height:12px; }
  .pd-docsearch .pd-navbtn:disabled{ opacity:.35; cursor:default; }
  .pd-docsearch .pd-navbtn:disabled:hover{ background:transparent; }

  .pd-docbody{ flex:1; display:flex; min-height:0; }

  #pd-frame{ flex:1; border:0; background:#fff; width:100%; height:100%; }

  @media (max-width:720px){
    .pd-hero h1{ font-size:21px; }
    .pd-search-box{ padding:13px 16px; }
    .pd-search-box input{ font-size:15.5px; }
  }
</style>
</head>
<body>
<div id="app">

  <div class="pd-topline">
    <div class="pd-brand" id="pd-brand">
      <img class="pd-brand-mark" src="favicon.ico" alt="PerpetualDoc" />
      <div class="pd-brand-name">PerpetualDoc</div>
      <div class="pd-brand-sub" id="pd-folder-label"></div>
    </div>
    <div class="pd-topline-right">
      <a class="pd-btn icon" href="https://github.com/NdeFaria/PerpetualDocWeb" target="_blank" rel="noopener noreferrer" title="Ver código-fonte no GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.34-1.28-1.7-1.28-1.7-1.04-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.71 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a10.98 10.98 0 015.79 0c2.2-1.49 3.17-1.18 3.17-1.18.64 1.59.24 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.44-2.69 5.42-5.25 5.7.41.36.78 1.06.78 2.14 0 1.55-.01 2.79-.01 3.17 0 .3.2.66.79.55A10.52 10.52 0 0023.5 12c0-6.35-5.15-11.5-11.5-11.5z"/></svg>

      <button class="pd-btn icon" id="pd-btn-theme" title="Alternar tema claro/escuro"></button>

  <!-- HOME / SPOTLIGHT -->

    <!-- ready / search state -->
    <div id="pd-search-area" style="display:none; width:100%; display:flex; flex-direction:column; align-items:center;">

      <div class="pd-hero">

      </div>
      <div class="pd-search-shell">
        <div class="pd-search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="pd-search-input" type="text" placeholder="Pesquisar documentações..." autocomplete="off" spellcheck="false" />
          <span class="pd-kbd">Ctrl K</span>
        </div>
        <div class="pd-results" id="pd-results" style="display:none;"></div>
      </div>
      <div class="pd-footnote">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
        <span id="pd-index-status">Tudo roda localmente no seu navegador. Nenhum arquivo é enviado para a internet.</span>
      </div>

  </div>

  <!-- DOC VIEWER -->
  <div id="view-doc">
    <div class="pd-docbar">
      <button class="pd-btn icon" id="pd-btn-back" title="Voltar">

        <input id="pd-inpage-search" type="text" placeholder="Buscar nesta página..." autocomplete="off" spellcheck="false" />

<script>
(function(){
"use strict";

/* =========================================================================
   PerpetualDoc Web
   A documentação é servida por um Service Worker que age como um servidor
   local dentro do próprio navegador — os arquivos são entregues exatamente
   como estão no disco (CSS, imagens, busca própria da documentação, tudo),
   sem reescrever nada. A única alteração possível é o CSS de tema escuro,
   e só quando o usuário liga esse tema. Nada é enviado a nenhum servidor
   externo: a "resposta" vem sempre da própria aba, lendo os arquivos que o
   usuário concedeu acesso.
   ========================================================================= */


const DB_NAME = "perpetualdoc";
const DB_VERSION = 2;
const DB_STORE = "handles";
const DB_STORE_CACHE = "textcache";
const DB_KEY = "docsFolder";
const THEME_KEY = "perpetualdoc.theme";
const IGNORED_DIRS = new Set([".git", ".svn", "__pycache__", "node_modules", ".vscode", ".idea"]);
const NOME_JSON_INDICE = "_perpetualdoc_index.json";
const CONCORRENCIA_LEITURA = 16;

let rootHandle = null;
let fileMap = new Map();     // caminho relativo (posix) -> FileSystemFileHandle
let docItems = [];           // { title, relFolder, indexPath, normText, normTitle, normPath, snippetSource }
let currentQuery = "";
let activeResultIndex = -1;
let currentPath = null;
// Calculado a partir de onde este próprio arquivo está sendo servido, então
// funciona em qualquer subcaminho (raiz do domínio, Netlify, ou um projeto do
// GitHub Pages tipo usuario.github.io/NomeDoRepo/) — não fica preso à raiz.
const PREFIXO_URL = location.pathname.replace(/[^/]*$/, "") + "__pd_docs__/";

const supportsFSAccess = typeof window.showDirectoryPicker === "function";

/* ---------------------------- IndexedDB helpers ---------------------------- */

function openDb(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
      if (!db.objectStoreNames.contains(DB_STORE_CACHE)) db.createObjectStore(DB_STORE_CACHE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function saveHandle(handle){
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).put(handle, DB_KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function loadHandle(){
  const db = await openDb();
  return new Promise((resolve) => {
    const tx = db.transaction(DB_STORE, "readonly");
    const req = tx.objectStore(DB_STORE).get(DB_KEY);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => resolve(null);
  });
}
async function clearHandle(){
  const db = await openDb();
  return new Promise((resolve) => {
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).delete(DB_KEY);
    tx.oncomplete = () => resolve();
  });
}
async function loadTextCache(){
  const db = await openDb();
  return new Promise((resolve) => {
    const map = new Map();
    try {
      const tx = db.transaction(DB_STORE_CACHE, "readonly");
      const cursorReq = tx.objectStore(DB_STORE_CACHE).openCursor();
      cursorReq.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor){ map.set(cursor.key, cursor.value); cursor.continue(); }
        else resolve(map);
      };
      cursorReq.onerror = () => resolve(map);
    } catch(e){ resolve(map); }
  });
}
async function persistTextCache(entradas){
  if (!entradas.length) return;
  const db = await openDb();
  return new Promise((resolve) => {
    try {
      const tx = db.transaction(DB_STORE_CACHE, "readwrite");
      const store = tx.objectStore(DB_STORE_CACHE);
      for (const [path, valor] of entradas) store.put(valor, path);
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    } catch(e){ resolve(); }
  });
}
async function clearTextCache(){
  const db = await openDb();
  return new Promise((resolve) => {
    try {
      const tx = db.transaction(DB_STORE_CACHE, "readwrite");
      tx.objectStore(DB_STORE_CACHE).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    } catch(e){ resolve(); }
  });
}

/* ---------------------------- Texto / normalização (para o índice de busca) ---------------------------- */

function normalizar(texto){
  return String(texto || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9_\-./ ]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function extrairTexto(htmlStr){
  const doc = new DOMParser().parseFromString(htmlStr, "text/html");
  doc.querySelectorAll("script,style,noscript").forEach(el => el.remove());
  const body = doc.body;
  return body ? body.textContent.replace(/\s+/g, " ").trim() : "";
}

function extrairTitulo(htmlStr){
  const m = htmlStr.match(/<title[^>]*>([^<]*)<\/title>/i);
  if (m && m[1] && m[1].trim()) return m[1].trim();
  return null;
}

/**
 * Lê um arquivo como texto tentando detectar o encoding real, em vez de assumir
 * UTF-8 sempre. Documentação PasDoc/Delphi antiga costuma sair em windows-1252
 * ou ISO-8859-1; ler isso como UTF-8 estraga acentos.
 */
async function lerComoTexto(file){
  const buf = await file.arrayBuffer();
  let declarado = null;
  try {
    const head = new TextDecoder("iso-8859-1").decode(buf.slice(0, 4096));
    const m = head.match(/charset=["']?\s*([a-z0-9_\-]+)/i);
    if (m) declarado = m[1].toLowerCase();
  } catch(e) { /* segue sem charset declarado */ }

  const tentativas = [];
  if (declarado) tentativas.push(declarado);
  tentativas.push("utf-8", "windows-1252", "iso-8859-1");

  for (const enc of tentativas){
    try {
      const decoder = new TextDecoder(enc, { fatal: enc === "utf-8" });
      return decoder.decode(buf);
    } catch(e) { continue; }
  }
  return new TextDecoder("utf-8", { fatal: false }).decode(buf);
}

/* ---------------------------- Caminhos relativos ---------------------------- */

function dirOf(relPath){
  const i = relPath.lastIndexOf("/");
  return i === -1 ? "" : relPath.slice(0, i);
}
function nameOf(relPath){
  const i = relPath.lastIndexOf("/");
  return i === -1 ? relPath : relPath.slice(i + 1);
}
function normalizeSegments(pathStr){
  const parts = pathStr.split("/");
  const out = [];
  for (const p of parts){
    if (p === "" || p === ".") continue;
    if (p === ".."){ out.pop(); }
    else out.push(p);
  }
  return out.join("/");
}
function resolveRelative(baseDir, ref){
  let clean = ref.replace(/\\/g, "/");
  try { clean = decodeURIComponent(clean); } catch(e) { /* mantem como esta */ }
  if (clean.startsWith("/")) return normalizeSegments(clean.slice(1));
  return normalizeSegments((baseDir ? baseDir + "/" : "") + clean);
}
function isExternal(ref){
  return /^([a-z]+:)?\/\//i.test(ref) || ref.startsWith("mailto:") || ref.startsWith("tel:") || ref.startsWith("data:") || ref.startsWith("javascript:");
}

/* ---------------------------- Varredura da pasta ---------------------------- */

async function varrerPasta(dirHandle, relPath, docFolders, ehRaiz){
  // Lista as entradas passo a passo (em vez de "for await" direto), pra que um
  // item problemático no meio da lista (arquivo temporário que sumiu, link
  // quebrado, algo sendo regravado na hora) não derrube a pasta inteira. Se a
  // pasta RAIZ em si estiver inacessível, o erro continua aparecendo de verdade.
  const entries = [];
  const iterador = dirHandle.values();
  while (true){
    let passo;
    try { passo = await iterador.next(); }
    catch(e) {
      if (ehRaiz) throw e;
      break; // pasta aninhada com problema: para aqui, mantém o que já leu
    }
    if (passo.done) break;
    entries.push(passo.value);
  }
  entries.sort((a, b) => a.name.localeCompare(b.name, "pt-BR"));

  let temIndex = false;
  for (const handle of entries){
    const childRel = relPath ? relPath + "/" + handle.name : handle.name;
    try {
      if (handle.kind === "file"){
        fileMap.set(childRel, handle);
        if (handle.name.toLowerCase() === "index.html") temIndex = true;
      } else if (handle.kind === "directory"){
        if (IGNORED_DIRS.has(handle.name.toLowerCase())) continue;
        await varrerPasta(handle, childRel, docFolders, false);
      }
    } catch(e) {
      // esta entrada específica ficou inacessível durante a varredura — pula e segue com o resto
      continue;
    }
  }
  if (temIndex) docFolders.push(relPath);
}

/** Executa `worker` sobre `items` com no máximo `limite` chamadas em paralelo. */
async function comConcorrencia(items, limite, worker){
  let i = 0;
  const executores = new Array(Math.min(limite, items.length) || 0).fill(0).map(async () => {
    while (i < items.length){
      const idx = i++;
      await worker(items[idx], idx);
    }
  });
  await Promise.all(executores);
}

/**
 * Se existir um _perpetualdoc_index.json na raiz da pasta conectada (gerado
 * por um script à parte, rodado fora do navegador), usa ele em vez de ler e
 * processar cada HTML na hora — muito mais rápido quando há muitas
 * documentações. Só aceita entradas cujo arquivo ainda existe de verdade na
 * pasta conectada; se o JSON não existir ou estiver inválido, devolve null e
 * o site cai de volta pra varredura normal, sem quebrar nada.
 */
async function tentarCarregarIndiceJson(){
  const fh = fileMap.get(NOME_JSON_INDICE);
  if (!fh) return null;
  try {
    const file = await fh.getFile();
    const texto = await file.text(); // JSON é sempre UTF-8, não precisa da cascata de encoding
    const dados = JSON.parse(texto);
    if (!dados || !Array.isArray(dados.documentos)) return null;
    const validos = dados.documentos.filter(d =>
      d && typeof d.indexPath === "string" && fileMap.has(d.indexPath) &&
      typeof d.normText === "string" && typeof d.title === "string"
    );
    return validos.length ? validos : null;
  } catch(e) {
    return null;
  }
}

let usouIndiceJson = false;

async function construirIndice(onProgress){
  fileMap = new Map();
  const docFolders = [];
  await varrerPasta(rootHandle, "", docFolders, true);

  const doIndiceJson = await tentarCarregarIndiceJson();
  usouIndiceJson = !!doIndiceJson;
  if (doIndiceJson){
    docItems = doIndiceJson;
    if (onProgress) onProgress(docItems.length, docItems.length);
    return docItems.length;
  }

  const todosHtmlPaths = [...fileMap.keys()].filter(p => /\.html?$/i.test(p));
  const cachePersistido = await loadTextCache();
  const textoPorArquivo = new Map();   // relPath -> texto extraido (sem tags)
  const tituloPorArquivo = new Map();  // relPath -> <title> ou null
  const entradasParaSalvar = [];

  let lidos = 0;
  await comConcorrencia(todosHtmlPaths, CONCORRENCIA_LEITURA, async (path) => {
    const fh = fileMap.get(path);
    try {
      const file = await fh.getFile();
      const anterior = cachePersistido.get(path);
      if (anterior && anterior.size === file.size && anterior.lastModified === file.lastModified){
        textoPorArquivo.set(path, anterior.texto);
        tituloPorArquivo.set(path, anterior.titulo);
      } else {
        const html = await lerComoTexto(file);
        const texto = extrairTexto(html);
        const titulo = extrairTitulo(html);
        textoPorArquivo.set(path, texto);
        tituloPorArquivo.set(path, titulo);
        entradasParaSalvar.push([path, { size: file.size, lastModified: file.lastModified, texto, titulo }]);
      }
    } catch(e){
      textoPorArquivo.set(path, "");
      tituloPorArquivo.set(path, null);
    }
    lidos++;
    if (onProgress) onProgress(lidos, todosHtmlPaths.length);
  });

  await persistTextCache(entradasParaSalvar);

  docItems = [];
  for (const relFolder of docFolders){
    const indexPath = relFolder ? relFolder + "/index.html" : "index.html";
    if (!fileMap.has(indexPath)) continue;

    const folderName = relFolder ? nameOf(relFolder) : (rootHandle.name || "Documentação");
    const title = tituloPorArquivo.get(indexPath) || folderName;
    const indexText = textoPorArquivo.get(indexPath) || "";

    const prefix = relFolder ? relFolder + "/" : "";
    let combinedText = title + " " + relFolder + " " + indexText;
    for (const hp of todosHtmlPaths){
      if (hp === indexPath || !hp.startsWith(prefix)) continue;
      combinedText += " " + hp + " " + (textoPorArquivo.get(hp) || "");
    }

    docItems.push({
      title,
      relFolder,
      indexPath,
      normText: normalizar(combinedText),
      normTitle: normalizar(title),
      normPath: normalizar(relFolder),
      snippetSource: indexText || combinedText
    });
  }

  return docItems.length;
}

/* ---------------------------- Busca (spotlight) ---------------------------- */

function contarOcorrencias(texto, termo){
  if (!termo) return 0;
  let count = 0, pos = 0;
  while ((pos = texto.indexOf(termo, pos)) !== -1){ count++; pos += termo.length; }
  return count;
}

function pontuarItem(item, termos){
  let score = 0;
  for (const t of termos){
    if (!item.normText.includes(t)) return -1;
    if (item.normTitle.includes(t)) score += 60;
    if (item.normPath.includes(t)) score += 20;
    score += Math.min(contarOcorrencias(item.normText, t), 12);
  }
  return score;
}

function gerarSnippet(item, termos){
  const raw = item.snippetSource || "";
  const rawLower = raw.toLowerCase();
  let hitPos = -1, hitLen = 0;
  for (const t of termos){
    const p = rawLower.indexOf(t);
    if (p !== -1 && (hitPos === -1 || p < hitPos)){ hitPos = p; hitLen = t.length; }
  }
  let start, snippet;
  if (hitPos === -1){
    snippet = raw.slice(0, 160);
  } else {
    start = Math.max(0, hitPos - 60);
    snippet = (start > 0 ? "…" : "") + raw.slice(start, start + 200) + (raw.length > start + 200 ? "…" : "");
  }
  let escaped = snippet
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  for (const t of termos){
    if (!t) continue;
    const re = new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
    escaped = escaped.replace(re, "<mark>$1</mark>");
  }
  return escaped;
}

function executarBusca(query){
  currentQuery = query;
  const termos = normalizar(query).split(" ").filter(Boolean);
  const resultsEl = document.getElementById("pd-results");

  if (!termos.length){
    resultsEl.style.display = "none";
    resultsEl.innerHTML = "";
    activeResultIndex = -1;
    return;
  }

  const pontuados = [];
  for (const item of docItems){
    const score = pontuarItem(item, termos);
    if (score >= 0) pontuados.push({ item, score });
  }
  pontuados.sort((a, b) => b.score - a.score);
  const top = pontuados.slice(0, 40);

  if (!top.length){
    resultsEl.style.display = "block";
    resultsEl.innerHTML = '<div class="pd-empty-state">Nenhuma documentação encontrada para "' + escapeHtml(query) + '".</div>';
    activeResultIndex = -1;
    return;
  }

  resultsEl.innerHTML = top.map((r, i) => {
    const path = r.item.relFolder || "/";
    return (
      '<button class="pd-result" data-index="' + i + '" data-path="' + escapeAttr(r.item.indexPath) + '">' +
        '<div class="pd-result-title">' + escapeHtml(r.item.title) + '</div>' +
        '<div class="pd-result-path">' + escapeHtml(path) + '</div>' +
        '<div class="pd-result-snippet">' + gerarSnippet(r.item, termos) + '</div>' +
      '</button>'
    );
  }).join("");
  resultsEl.style.display = "block";
  activeResultIndex = 0;
  atualizarDestaqueResultados();

  resultsEl.querySelectorAll(".pd-result").forEach(btn => {
    btn.addEventListener("click", () => abrirDocumento(btn.getAttribute("data-path")));
  });
}

function atualizarDestaqueResultados(){
  const resultsEl = document.getElementById("pd-results");
  resultsEl.querySelectorAll(".pd-result").forEach((el, i) => {
    el.classList.toggle("active", i === activeResultIndex);
  });
  const activeEl = resultsEl.querySelector(".pd-result.active");
  if (activeEl) activeEl.scrollIntoView({ block: "nearest" });
}

function escapeHtml(s){
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escapeAttr(s){
  return escapeHtml(s).replace(/"/g,"&quot;");
}

/* Mapa de extensão -> MIME, usado pra responder cada arquivo com o Content-Type
   correto — igual um servidor de verdade faria. Sem isso, o navegador pode
   ignorar CSS/JS silenciosamente por falha de checagem estrita de tipo. */
const MIME_POR_EXTENSAO = {
  html: "text/html", htm: "text/html", css: "text/css",
  js: "application/javascript", mjs: "application/javascript", json: "application/json",
  png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif",
  svg: "image/svg+xml", webp: "image/webp", bmp: "image/bmp", ico: "image/x-icon",
  woff: "font/woff", woff2: "font/woff2", ttf: "font/ttf", otf: "font/otf",
  txt: "text/plain", pdf: "application/pdf", xml: "application/xml"
};
function mimeFor(relPath){
  const ext = (relPath.split(".").pop() || "").toLowerCase();
  return MIME_POR_EXTENSAO[ext] || "application/octet-stream";
}

/** Insere só o CSS de tema escuro antes de </head> (ou de <body>, ou no início,
 *  na falta dos dois) — a ÚNICA alteração que este app faz, e só quando o
 *  próprio usuário liga o tema escuro. Fora isso, o HTML sai byte a byte. */
function injetarTemaEscuro(html){
  const bloco = '\n<style id="pd-dark-theme">\n' + CSS_TEMA_ESCURO_DOC + '\n</style>\n';
  const lower = html.toLowerCase();
  const posHead = lower.indexOf("</head>");
  if (posHead >= 0) return html.slice(0, posHead) + bloco + html.slice(posHead);
  const posBody = lower.indexOf("<body");
  if (posBody >= 0) return html.slice(0, posBody) + bloco + html.slice(posBody);
  return bloco + html;
}

/**
 * Responde ao pedido de um arquivo vindo do Service Worker.
 * - Tema claro (padrão): devolve os bytes do arquivo exatamente como estão no
 *   disco, com o Content-Type certo por extensão. Pra HTML isso inclui NÃO
 *   forçar nenhum charset — o navegador lê o <meta charset> do próprio arquivo,
 *   exatamente como faria abrindo o arquivo direto.
 * - Tema escuro: só nesse caso o HTML é lido (com detecção de encoding, só
 *   pra poder inserir o <style> com segurança) e devolvido como utf-8 com o
 *   CSS extra. Nenhum outro tipo de arquivo é afetado pelo tema.
 */
/* Tipos de arquivo tratados como texto: corrige o encoding (a mesma cascata
   usada em todo o app) e reemite como UTF-8. Sem isso, arquivos de dados que
   a própria documentação carrega via JavaScript — como o índice da busca
   nativa do PasDoc (Tipue Search) — vinham com bytes crus, e como não têm um
   <meta charset> próprio pro navegador detectar (diferente do HTML), viravam
   acento quebrado. Arquivos binários (imagem, fonte) continuam intocados. */
const TIPOS_TEXTO = new Set(["text/html", "application/javascript", "text/css", "application/json", "text/plain", "application/xml"]);

async function responderRequisicaoArquivo(relPath){
  const fh = fileMap.get(relPath);
  if (!fh) return { ok: false, status: 404, mensagem: "Arquivo não encontrado na pasta conectada: " + relPath };

  let file;
  try { file = await fh.getFile(); }
  catch(e){ return { ok: false, status: 404, mensagem: "Não foi possível ler o arquivo." }; }

  const tipo = mimeFor(relPath);

  if (TIPOS_TEXTO.has(tipo)){
    let texto;
    try { texto = await lerComoTexto(file); }
    catch(e){ return { ok: false, status: 500, mensagem: "Erro ao ler o arquivo." }; }
    if (tipo === "text/html" && temaAtual() === "dark"){
      texto = injetarTemaEscuro(texto);
    }
    return { ok: true, tipo: tipo + "; charset=utf-8", texto };
  }

  let buffer;
  try { buffer = await file.arrayBuffer(); }
  catch(e){ return { ok: false, status: 500, mensagem: "Erro ao ler o arquivo." }; }
  return { ok: true, tipo, buffer };
}

async function garantirServiceWorker(){
  if (!("serviceWorker" in navigator)) return false;
  try {
    await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;
    return true;
  } catch(e){ return false; }
}

if ("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("message", async (event) => {
    const data = event.data || {};
    if (data.type !== "pd-file-request") return;
    const resposta = await responderRequisicaoArquivo(data.path);
    if (!navigator.serviceWorker.controller) return;
    if (!resposta.ok){
      navigator.serviceWorker.controller.postMessage({ type: "pd-file-response", id: data.id, ok: false, status: resposta.status, mensagem: resposta.mensagem });
      return;
    }
    if (resposta.texto !== undefined){
      navigator.serviceWorker.controller.postMessage({ type: "pd-file-response", id: data.id, ok: true, tipo: resposta.tipo, texto: resposta.texto });
    } else {
      navigator.serviceWorker.controller.postMessage({ type: "pd-file-response", id: data.id, ok: true, tipo: resposta.tipo, buffer: resposta.buffer }, [resposta.buffer]);
    }
  });
}

/* ---------------------------- Abrir documentos ---------------------------- */

// Pilha própria de navegação, restrita à documentação atualmente aberta — não
// usamos o histórico nativo do navegador pro botão "voltar" porque a navegação
// de um iframe entra no histórico conjunto da aba inteira, e voltar demais
// podia sair do site ou cair numa página em branco.
let navStack = [];
let navIndex = -1;
let suprimirProximoRegistro = false;

function caminhoParaUrl(relPath){
  return PREFIXO_URL + relPath.split("/").map(encodeURIComponent).join("/");
}

function abrirDocumento(relPath){
  if (!fileMap.has(relPath)){
    alert("Não foi possível localizar este arquivo na pasta conectada:\n" + relPath);
    return;
  }
  navStack = [];
  navIndex = -1;
  mostrarViewDoc();
  document.getElementById("pd-frame").src = caminhoParaUrl(relPath);
}

function atualizarBreadcrumb(relPath){
  const item = docItems.find(d => d.indexPath === relPath);
  const folder = dirOf(relPath);
  const parts = folder ? folder.split("/") : [];
  const crumb = document.getElementById("pd-crumb");
  if (item){
    const trail = parts.length ? parts.join(" / ") + " / " : "";
    crumb.innerHTML = escapeHtml(trail) + "<b>" + escapeHtml(item.title) + "</b>";
  } else {
    const docPai = docItems.find(d => relPath.startsWith(d.relFolder ? d.relFolder + "/" : ""));
    const nomePagina = nameOf(relPath);
    crumb.innerHTML = docPai ? (escapeHtml(docPai.title) + " / <b>" + escapeHtml(nomePagina) + "</b>") : "<b>" + escapeHtml(nomePagina) + "</b>";
  }
}

function mostrarViewDoc(){
  document.getElementById("view-home").classList.add("hidden");
  document.getElementById("view-doc").classList.add("active");
}
function mostrarViewHome(){
  document.getElementById("view-doc").classList.remove("active");
  document.getElementById("view-home").classList.remove("hidden");
  document.getElementById("pd-frame").src = "about:blank";
  limparMarcas();
  currentPath = null;
  navStack = [];
  navIndex = -1;
  document.getElementById("pd-search-input").focus();
}

// Sincroniza breadcrumb sempre que o iframe navega — seja pela abertura inicial,
// seja por um link interno clicado dentro da própria documentação (que navega
// do jeito normal, nativo, sem nenhuma interceptação) — e registra a página na
// nossa própria pilha, a menos que essa navegação seja resultado do botão
// "voltar" (que já sabe pra onde está indo e não deve registrar de novo).
document.getElementById("pd-frame").addEventListener("load", () => {
  const frame = document.getElementById("pd-frame");
  let caminho;
  try { caminho = frame.contentWindow.location.pathname; }
  catch(e){ return; }
  if (!caminho || !caminho.startsWith(PREFIXO_URL)) return;

  const relPath = decodeURIComponent(caminho.slice(PREFIXO_URL.length));
  if (!fileMap.has(relPath)) return;

  if (suprimirProximoRegistro){
    suprimirProximoRegistro = false;
  } else {
    navStack = navStack.slice(0, navIndex + 1);
    navStack.push(relPath);
    navIndex = navStack.length - 1;
  }

  currentPath = relPath;
  atualizarBreadcrumb(relPath);
  document.getElementById("pd-btn-back").style.visibility = navIndex > 0 ? "visible" : "hidden";
  limparMarcas();
  document.getElementById("pd-inpage-search").value = "";
  document.getElementById("pd-inpage-count").textContent = "";
  atualizarBotoesInpage();
});

/* ---------------------------- Busca dentro do documento aberto ----------------------------
   Feita direto no DOM já carregado (mesma origem de verdade agora, então sempre
   acessível), sem injetar nada na documentação — é só realce visual temporário,
   como um Ctrl+F, desfeito a cada nova busca ou navegação. */

let marcasAtuais = [];
let marcaAtivaIndex = -1;

function coletarDocumentosAcessiveis(win, resultado){
  try {
    if (win.document) resultado.push(win.document);
    for (let i = 0; i < win.frames.length; i++) coletarDocumentosAcessiveis(win.frames[i], resultado);
  } catch(e) { /* ignora */ }
}

function limparMarcas(){
  marcasAtuais.forEach(({ mark }) => {
    const pai = mark.parentNode;
    if (!pai) return;
    pai.replaceChild(mark.ownerDocument.createTextNode(mark.textContent), mark);
    pai.normalize();
  });
  marcasAtuais = [];
  marcaAtivaIndex = -1;
}

function normalizarBusca(t){
  return String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

function buscarNoDocumentoAberto(termo){
  limparMarcas();
  const frame = document.getElementById("pd-frame");
  const contagemEl = document.getElementById("pd-inpage-count");

  if (!termo || !frame.contentWindow){
    contagemEl.textContent = "";
    atualizarBotoesInpage();
    return;
  }

  const docs = [];
  coletarDocumentosAcessiveis(frame.contentWindow, docs);
  const termoNorm = normalizarBusca(termo);

  docs.forEach((doc) => {
    if (!doc || !doc.body) return;
    const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, {
      acceptNode(n){
        const p = n.parentElement;
        if (!p) return NodeFilter.FILTER_REJECT;
        if (p.tagName === "SCRIPT" || p.tagName === "STYLE" || p.tagName === "MARK") return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);

    nodes.forEach((node) => {
      const text = node.nodeValue;
      if (normalizarBusca(text).indexOf(termoNorm) === -1) return;
      const fresh = new RegExp(termo.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
      const frag = doc.createDocumentFragment();
      let last = 0, m;
      while ((m = fresh.exec(text))){
        if (m.index > last) frag.appendChild(doc.createTextNode(text.slice(last, m.index)));
        const mark = doc.createElement("mark");
        mark.style.background = "#facc15";
        mark.style.color = "#111827";
        mark.style.borderRadius = "2px";
        mark.textContent = m[0];
        frag.appendChild(mark);
        marcasAtuais.push({ mark });
        last = m.index + m[0].length;
        if (fresh.lastIndex === m.index) fresh.lastIndex++;
      }
      if (last < text.length) frag.appendChild(doc.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(frag, node);
    });
  });

  marcaAtivaIndex = marcasAtuais.length ? 0 : -1;
  destacarMarcaAtiva();
  contagemEl.textContent = marcasAtuais.length ? String(marcasAtuais.length) : "0";
  atualizarBotoesInpage();
}

function destacarMarcaAtiva(){
  marcasAtuais.forEach(({ mark }) => {
    mark.style.background = "#facc15";
    mark.style.outline = "";
  });
  if (marcaAtivaIndex < 0 || marcaAtivaIndex >= marcasAtuais.length) return;
  const { mark } = marcasAtuais[marcaAtivaIndex];
  mark.style.background = "#fb923c";
  mark.style.outline = "2px solid #fff";
  mark.scrollIntoView({ behavior: "smooth", block: "center" });
}

function irParaReferencia(direcao){
  if (!marcasAtuais.length) return;
  marcaAtivaIndex = direcao === "prev"
    ? (marcaAtivaIndex - 1 + marcasAtuais.length) % marcasAtuais.length
    : (marcaAtivaIndex + 1) % marcasAtuais.length;
  destacarMarcaAtiva();
  document.getElementById("pd-inpage-count").textContent = (marcaAtivaIndex + 1) + "/" + marcasAtuais.length;
}

function atualizarBotoesInpage(){
  const termo = document.getElementById("pd-inpage-search").value.trim();
  const habilitado = !!termo && marcasAtuais.length > 0;
  document.getElementById("pd-btn-inpage-prev").disabled = !habilitado;
  document.getElementById("pd-btn-inpage-next").disabled = !habilitado;
}

/* ---------------------------- Fluxo de conexão da pasta ---------------------------- */

function renderConnectScreen(state, extra){
  extra = extra || {};
  const body = document.getElementById("pd-connect-body");
  document.getElementById("pd-connect").style.display = "block";
  document.getElementById("pd-search-area").style.display = "none";

  if (state === "unsupported"){
    body.innerHTML =
      '<h2>Navegador não suportado</h2>' +
      '<p>Este recurso de acesso a pastas locais só existe no Chrome, Edge ou outro navegador baseado em Chromium. Abra esta página em um deles para continuar.</p>';
    return;
  }

  if (state === "sw-unsupported"){
    body.innerHTML =
      '<h2>Precisa ser aberto por um servidor</h2>' +
      '<p>Pra apresentar a documentação exatamente como ela é (CSS, busca própria, tudo funcionando), este app depende de um recurso que só funciona quando a página é aberta via <b style="color:var(--text)">http/https</b> — não funciona mais abrindo o arquivo direto (file://).</p>' +
      '<p>Publique no Netlify ou GitHub Pages normalmente (os dois arquivos, <code>index.html</code> e <code>sw.js</code>, juntos), ou, pra testar localmente antes, rode um servidor simples nesta pasta:</p>' +
      '<p style="font-family:var(--mono); background:var(--panel-2); padding:8px 10px; border-radius:6px; font-size:12.5px; text-align:left;">python3 -m http.server 8080</p>';
    return;
  }

  if (state === "initial"){
    body.innerHTML =
      '<h2>Conectar pasta de documentação</h2>' +
      '<p>Escolha a pasta onde a documentação está salva. Nada é enviado a lugar nenhum — a leitura acontece só neste navegador.</p>' +
      '<button class="pd-btn primary" id="pd-btn-connect">Selecionar pasta</button>';
    document.getElementById("pd-btn-connect").addEventListener("click", solicitarPasta);
    return;
  }

  if (state === "reconnect"){
    body.innerHTML =
      '<h2>Bem-vindo de volta</h2>' +
      '<p>Pasta salva: <b style="color:var(--text)">' + escapeHtml(extra.name || "") + '</b><br>Confirme o acesso para continuar de onde parou.</p>' +
      '<button class="pd-btn primary" id="pd-btn-reconnect">Continuar</button>' +
      '<div class="pd-alt"><button id="pd-btn-forget">Usar outra pasta</button></div>';
    document.getElementById("pd-btn-reconnect").addEventListener("click", () => confirmarPermissao(rootHandle));
    document.getElementById("pd-btn-forget").addEventListener("click", async () => {
      await clearHandle();
      await clearTextCache();
      rootHandle = null;
      renderConnectScreen("initial");
    });
    return;
  }

  if (state === "indexing"){
    body.innerHTML =
      '<div class="pd-spinner"></div>' +
      '<h2>Indexando documentação</h2>' +
      '<p>Lendo os arquivos HTML para montar a busca. Isso não altera nem envia nada.</p>' +
      '<div class="pd-progress" id="pd-progress">0 / 0</div>';
    return;
  }

  if (state === "error"){
    body.innerHTML =
      '<h2>Não foi possível acessar a pasta</h2>' +
      '<p>' + escapeHtml(extra.message || "Verifique se a pasta ainda existe no local original.") + '</p>' +
      '<button class="pd-btn primary" id="pd-btn-retry">Selecionar pasta novamente</button>';
    document.getElementById("pd-btn-retry").addEventListener("click", async () => {
      await clearHandle();
      await clearTextCache();
      rootHandle = null;
      renderConnectScreen("initial");
    });
    return;
  }
}

async function solicitarPasta(){
  try {
    const handle = await window.showDirectoryPicker({ mode: "read" });
    rootHandle = handle;
    await saveHandle(handle);
    await indexarERenderizar();
  } catch(e){
    if (e && e.name === "AbortError") return;
    renderConnectScreen("error", { message: e && e.message ? e.message : String(e) });
  }
}

async function confirmarPermissao(handle){
  try {
    let perm = await handle.queryPermission({ mode: "read" });
    if (perm !== "granted") perm = await handle.requestPermission({ mode: "read" });
    if (perm !== "granted"){
      renderConnectScreen("error", { message: "Permissão de leitura negada para a pasta." });
      return;
    }
    await indexarERenderizar();
  } catch(e){
    renderConnectScreen("error", { message: e && e.message ? e.message : String(e) });
  }
}

async function indexarERenderizar(){
  renderConnectScreen("indexing");
  try {
    const total = await construirIndice((done, all) => {
      const p = document.getElementById("pd-progress");
      if (p) p.textContent = done + " / " + all;
    });
    document.getElementById("pd-connect").style.display = "none";
    document.getElementById("pd-search-area").style.display = "flex";
    document.getElementById("pd-index-status").textContent =
      total + " documentação(ões) indexada(s)" + (usouIndiceJson ? " (via índice pré-gerado)" : "") + ". Busca sem acento, por nome e conteúdo. Nada sai deste navegador.";
    atualizarPillPasta();
    document.getElementById("pd-search-input").value = "";
    executarBusca("");
    document.getElementById("pd-search-input").focus();
  } catch(e){
    renderConnectScreen("error", { message: e && e.message ? e.message : String(e) });
  }
}

function atualizarPillPasta(){
  document.getElementById("pd-folder-label").textContent = rootHandle ? ("· " + rootHandle.name) : "";
  const area = document.getElementById("pd-status-area");
  area.innerHTML =
    '<div class="pd-pill"><span class="dot"></span>Local, offline</div>' +
    '<button class="pd-btn icon" id="pd-btn-rescan" title="Reescanear documentações (use depois de trocar de branch ou atualizar os fontes)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-2.64-6.36"/><path d="M21 4v6h-6"/></svg></button>' +
    '<button class="pd-btn" id="pd-btn-trocar-pasta">Trocar pasta</button>';

  document.getElementById("pd-btn-rescan").addEventListener("click", async () => {
    mostrarViewHome();
    await indexarERenderizar();
  });

  document.getElementById("pd-btn-trocar-pasta").addEventListener("click", async () => {
    await clearHandle();
    await clearTextCache();
    rootHandle = null;
    fileMap = new Map();
    docItems = [];
    mostrarViewHome();
    renderConnectScreen("initial");
  });
}

/* ---------------------------- Tema claro/escuro ---------------------------- */

const ICONE_SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
const ICONE_LUA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>';

function temaAtual(){
  try { return localStorage.getItem(THEME_KEY) === "light" ? "light" : "dark"; }
  catch(e){ return "dark"; }
}

function aplicarTema(tema, semRecarregarDoc){
  document.body.classList.toggle("pd-light", tema === "light");
  try { localStorage.setItem(THEME_KEY, tema); } catch(e) { /* localStorage indisponível, segue sem persistir */ }

  const btn = document.getElementById("pd-btn-theme");
  if (btn) btn.innerHTML = tema === "dark" ? ICONE_SOL : ICONE_LUA;

  if (!semRecarregarDoc && currentPath){
    document.getElementById("pd-frame").src = caminhoParaUrl(currentPath) + "?_pd=" + Date.now();
  }
}

document.getElementById("pd-btn-theme").addEventListener("click", () => {
  aplicarTema(temaAtual() === "dark" ? "light" : "dark");
});

/* ---------------------------- Eventos de UI ---------------------------- */

document.getElementById("pd-brand").addEventListener("click", () => {
  if (rootHandle) mostrarViewHome();
});

document.getElementById("pd-btn-back").addEventListener("click", () => {
  if (navIndex <= 0) return;
  navIndex--;
  suprimirProximoRegistro = true;
  document.getElementById("pd-frame").src = caminhoParaUrl(navStack[navIndex]);
});

let debounceTimer = null;
document.getElementById("pd-search-input").addEventListener("input", (e) => {
  clearTimeout(debounceTimer);
  const val = e.target.value;
  debounceTimer = setTimeout(() => executarBusca(val), 120);
});
document.getElementById("pd-search-input").addEventListener("keydown", (e) => {
  const results = document.querySelectorAll("#pd-results .pd-result");
  if (e.key === "ArrowDown"){
    e.preventDefault();
    if (!results.length) return;
    activeResultIndex = Math.min(activeResultIndex + 1, results.length - 1);
    atualizarDestaqueResultados();
  } else if (e.key === "ArrowUp"){
    e.preventDefault();
    if (!results.length) return;
    activeResultIndex = Math.max(activeResultIndex - 1, 0);
    atualizarDestaqueResultados();
  } else if (e.key === "Enter"){
    if (activeResultIndex >= 0 && results[activeResultIndex]){
      abrirDocumento(results[activeResultIndex].getAttribute("data-path"));
    }
  }
});

document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){
    e.preventDefault();
    if (document.getElementById("view-doc").classList.contains("active")) mostrarViewHome();
    else document.getElementById("pd-search-input").focus();
  }
  if (e.key === "Escape" && document.getElementById("view-doc").classList.contains("active")){
    mostrarViewHome();
  }
});

let inpageDebounce = null;
document.getElementById("pd-inpage-search").addEventListener("input", (e) => {
  clearTimeout(inpageDebounce);
  const termo = e.target.value;
  inpageDebounce = setTimeout(() => buscarNoDocumentoAberto(termo.trim()), 150);
});
document.getElementById("pd-inpage-search").addEventListener("keydown", (e) => {
  if (e.key === "Enter"){
    e.preventDefault();
    irParaReferencia(e.shiftKey ? "prev" : "next");
  }
});
document.getElementById("pd-btn-inpage-next").addEventListener("click", () => irParaReferencia("next"));
document.getElementById("pd-btn-inpage-prev").addEventListener("click", () => irParaReferencia("prev"));

/* ---------------------------- Inicialização ---------------------------- */

aplicarTema(temaAtual(), true);

async function iniciar(){
  if (!supportsFSAccess){
    renderConnectScreen("unsupported");
    return;
  }
  const swOk = await garantirServiceWorker();
  if (!swOk){
    renderConnectScreen("sw-unsupported");
    return;
  }
  const saved = await loadHandle();
  if (!saved){
    renderConnectScreen("initial");
    return;
  }
  rootHandle = saved;
  try {
    const perm = await saved.queryPermission({ mode: "read" });
    if (perm === "granted"){
      await indexarERenderizar();
    } else {
      renderConnectScreen("reconnect", { name: saved.name });
    }
  } catch(e){
    renderConnectScreen("reconnect", { name: saved.name });
  }
}

iniciar();

})();
</script>
